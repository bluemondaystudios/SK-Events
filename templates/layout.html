<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}SK Events{% endblock %} &mdash; Sekhukhune Entertainment News</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<body>

<header>
    <a href="{% url 'home' %}" class="masthead-link">
        <h1>SK EVENTS</h1>
        <p class="masthead-strap">Sekhukhune Entertainment News</p>
    </a>
    <nav>
        <a href="{% url 'home' %}">Home</a>
        {% for value, label in nav_categories %}
            <a href="{% url 'article-category' value|lower %}">{{ label }}</a>
        {% endfor %}
    </nav>
</header>

<main>
    {% block content %}
    <!-- page-specific content will go here -->
    {% endblock %}
</main>

<footer>
    <p>&copy; 2026 Blue Monday Studios. All rights reserved.</p>
</footer>

</body>
</html>
