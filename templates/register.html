{% extends 'layout.html' %}

{% block title %}Register{% endblock %}

{% block content %}
<h2>Create Your Account</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Register</button>
</form>
<p>Already have an account? <a href="{% url 'login' %}">Login here</a></p>
{% endblock %}
