

{% extends 'layout.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<h2>Login</h2>
<section class="card">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn" type="submit">Login</button>
    </form>
    <p>Don't have an account? <a href="{% url 'register' %}">Register</a></p>
</section>
{% endblock %}
