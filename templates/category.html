{% extends 'layout.html' %}

{% block title %}{{ category_label }}{% endblock %}

{% block content %}

<h2>{{ category_label }}</h2>

{% if articles %}
    <div class="articles-grid">
        {% for article in articles %}
            {% include "_article_card.html" %}
        {% endfor %}
    </div>
{% else %}
    <p class="muted">No articles in this category yet.</p>
{% endif %}

{% endblock %}
