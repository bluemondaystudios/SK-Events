<article class="article-card">
    <a href="{% url 'article-detail' article.slug %}">
        {% if article.featured_image %}
            <img src="{{ article.featured_image.url }}" alt="{{ article.title }}" class="article-image">
        {% else %}
            <div class="article-image article-image-placeholder"></div>
        {% endif %}
    </a>
    <div class="article-body">
        <span class="category-pill">{{ article.get_category_display }}</span>
        <h3><a href="{% url 'article-detail' article.slug %}">{{ article.title }}</a></h3>
        <p class="muted">{{ article.display_excerpt }}</p>
        <p class="byline">{{ article.published_at|date:"M d, Y" }}</p>
    </div>
</article>
