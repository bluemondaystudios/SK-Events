<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Something went wrong</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            background: #ffffff;
            color: #111111;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        header {
            background: #111111;
            color: #ffffff;
            padding: 15px 20px;
            text-align: left;
        }
        header h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
        }
        main {
            padding: 60px 20px;
        }
        .card {
            max-width: 420px;
            margin: 0 auto;
            padding: 30px;
            border: 1.5px solid #111111;
            border-radius: 8px;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            background: #111111;
            color: #ffffff;
            border-radius: 6px;
            font-weight: 700;
            text-decoration: none;
            margin-top: 10px;
        }
        .muted {
            color: #767676;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

<header>
    <h1>SK EVENTS (NPC)</h1>
</header>

<main>
    <div class="card">
        <h2>Something went wrong</h2>
        <p class="muted">
            That's on us, not you. Try again in a moment -- if it keeps
            happening, let us know what you were doing when it happened.
        </p>
        <a class="btn" href="/">Back to Home</a>
    </div>
</main>

</body>
</html>
